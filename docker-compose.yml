services:
  securehub-db:
    image: postgres:18.6-alpine
    container_name: securehub_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - backups-data:/var/backups
      - ./base_datos/00-create-app-user.sh:/docker-entrypoint-initdb.d/00-create-app-user.sh:ro
      # Scripts de inicializaciÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â³n de Postgres. OJO: el entrypoint de la imagen de Postgres SOLO ejecuta
      # los scripts de /docker-entrypoint-initdb.d/ en la PRIMERA inicializaciÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â³n del volumen de datos
      # (volumen vacÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â­o). Sobre un volumen ya inicializado NO se vuelven a ejecutar; en ese caso las
      # migraciones deben aplicarse manualmente con psql. Los prefijos numÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â©ricos fuerzan el orden de
      # ejecuciÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â³n alfabÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â©tico: primero las tablas base (01), luego v2 (02) y por ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Âºltimo v3 (03), ya que
      # v3 depende de columnas/constraints creados en v2.
      - ./base_datos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./base_datos/02-migration-v2.sql:/docker-entrypoint-initdb.d/02-migration-v2.sql:ro
      - ./base_datos/03-migration-v3.sql:/docker-entrypoint-initdb.d/03-migration-v3.sql:ro
      - ./base_datos/04-migration-v4.sql:/docker-entrypoint-initdb.d/04-migration-v4.sql:ro
    networks:
      - securehub_lan
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  securehub-redis:
    image: redis:7-alpine
    container_name: securehub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - securehub_lan
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  securehub-db-bootstrap:
    image: postgres:18.6-alpine
    container_name: securehub_db_bootstrap
    environment:
      PGHOST: securehub-db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./base_datos/04-migration-v4.sql:/migrations/04-migration-v4.sql:ro
    entrypoint: ["sh", "-ec"]
    command:
      - |
        : "$${DB_APP_PASSWORD:?Define DB_APP_PASSWORD}"
        until pg_isready; do sleep 2; done
        psql --set=ON_ERROR_STOP=1 --set="db_app_password=$$DB_APP_PASSWORD" <<'SQL'
        ALTER ROLE app_user WITH LOGIN PASSWORD :'db_app_password';
        SQL
        psql --set=ON_ERROR_STOP=1 --file=/migrations/04-migration-v4.sql
    depends_on:
      securehub-db:
        condition: service_healthy
    networks:
      - securehub_lan
    restart: "no"

  securehub-evidence-init:
    image: alpine:3.22
    container_name: securehub_evidence_init
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data && chown 1000:1000 /data"]
    volumes:
      - files-data:/data
    restart: "no"

  securehub-logs-init:
    image: alpine:3.22
    container_name: securehub_logs_init
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/scanner /data/trivy-cache && chown 1000:1000 /data && chown -R 1000:1000 /data/scanner /data/trivy-cache"]
    volumes:
      - logs-data:/data
    restart: "no"

  securehub-files:
    image: nginx:alpine
    container_name: securehub_files
    volumes:
      - files-data:/usr/share/nginx/html/evidencias
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      securehub-evidence-init:
        condition: service_completed_successfully
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-scanner:
    build: ./scanner
    container_name: securehub_scanner
    environment:
      API_URL: http://securehub-api:3000
      SCAN_TARGET: /scan-target
      SCAN_OUTPUT_DIR: /var/logs/scanner/scanner
      SCAN_INTERVAL_MS: ${SCANNER_INTERVAL_MS:-21600000}
      TRIVY_CACHE_DIR: /var/logs/scanner/trivy-cache
    volumes:
      - logs-data:/var/logs/scanner
      - ./backend:/scan-target/backend:ro
      - ./frontend:/scan-target/frontend:ro
      - ./scanner:/scan-target/scanner:ro
      - ./base_datos:/scan-target/base_datos:ro
      - ./config:/scan-target/config:ro
      - ./deploy:/scan-target/deploy:ro
      - ./monitoring:/scan-target/monitoring:ro
      - ./.github:/scan-target/.github:ro
      - ./security:/scan-target/security:ro
      - ./docker-compose.yml:/scan-target/docker-compose.yml:ro
      - ./docker-compose.staging.yml:/scan-target/docker-compose.staging.yml:ro
    networks:
      - securehub_lan
    depends_on:
      securehub-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "try{const f='/var/logs/scanner/scanner/latest.json';JSON.parse(require('fs').readFileSync(f));process.exit(Date.now()-require('fs').statSync(f).mtimeMs<86400000?0:1)}catch{process.exit(1)}"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

  securehub-api:
    build: ./backend
    container_name: securehub_api
    environment:
      DB_HOST: securehub-db
      DB_NAME: ${DB_NAME}                  # <- InyecciÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â³n explÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â­cita
      DB_APP_USER: app_user                # Cuenta de bajo privilegio creada por la inicialización
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}  # <- Cuenta de bajo privilegio de la API
      JWT_SECRET: ${JWT_SECRET}            # <- InyecciÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â³n explÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â­cita
      REDIS_HOST: securehub-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FILE_SERVER_URL: http://securehub-files
      DISABLE_BACKGROUND_WORKERS: "true"
    depends_on:
      securehub-db:
        condition: service_healthy
      securehub-db-bootstrap:
        condition: service_completed_successfully
      securehub-evidence-init:
        condition: service_completed_successfully
      securehub-logs-init:
        condition: service_completed_successfully
      securehub-redis:
        condition: service_healthy
    volumes:
      - logs-data:/app/logs
      - files-data:/app/uploads
      - ./backend/src:/app/src
    networks:
      - securehub_lan
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  securehub-worker:
    build: ./backend
    container_name: securehub_worker
    command: ["node", "src/workers/worker.js"]
    environment:
      DB_HOST: securehub-db
      DB_NAME: ${DB_NAME}
      DB_APP_USER: app_user
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      REDIS_HOST: securehub-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      securehub-db-bootstrap:
        condition: service_completed_successfully
      securehub-logs-init:
        condition: service_completed_successfully
    volumes:
      - logs-data:/app/logs
    networks:
      - securehub_lan
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  securehub-frontend:
    build: ./frontend
    container_name: securehub_frontend
    depends_on:
      - securehub-api
    networks:
      - securehub_lan
    ports:
      - "80:8080"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: vulntrack_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - securehub_lan
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: vulntrack_alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
      - ./monitoring/alertmanager/telegram-token.txt:/etc/alertmanager/telegram-token.txt:ro
    ports:
      - "9093:9093"
    networks:
      - securehub_lan
    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.3.0
    container_name: vulntrack_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - securehub_lan
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.0
    container_name: vulntrack_loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - securehub_lan
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: vulntrack_alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - securehub_lan
    restart: unless-stopped
networks:
  securehub_lan:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  files-data:
  logs-data:
  backups-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
