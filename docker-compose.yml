services:
  securehub-db:
    image: postgres:18.6-alpine
    container_name: securehub_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - backups-data:/var/backups
      # Scripts de inicialización de Postgres. OJO: el entrypoint de la imagen de Postgres SOLO ejecuta
      # los scripts de /docker-entrypoint-initdb.d/ en la PRIMERA inicialización del volumen de datos
      # (volumen vacío). Sobre un volumen ya inicializado NO se vuelven a ejecutar; en ese caso las
      # migraciones deben aplicarse manualmente con psql. Los prefijos numéricos fuerzan el orden de
      # ejecución alfabético: primero las tablas base (01), luego v2 (02) y por último v3 (03), ya que
      # v3 depende de columnas/constraints creados en v2.
      - ./base_datos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./base_datos/02-migration-v2.sql:/docker-entrypoint-initdb.d/02-migration-v2.sql:ro
      - ./base_datos/03-migration-v3.sql:/docker-entrypoint-initdb.d/03-migration-v3.sql:ro
    networks:
      - securehub_lan
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  securehub-redis:
    image: redis:7-alpine
    container_name: securehub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - securehub_lan
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  securehub-files:
    image: nginx:alpine
    container_name: securehub_files
    volumes:
      - files-data:/usr/share/nginx/html/evidencias
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-scanner:
    build: ./scanner
    container_name: securehub_scanner
    environment:
      API_URL: http://securehub-api:3000
    volumes:
      - logs-data:/var/logs/scanner
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-api:
    build: ./backend
    container_name: securehub_api
    environment:
      DB_HOST: securehub-db
      DB_NAME: ${DB_NAME}                  # <- Inyección explícita
      DB_USER: ${DB_USER}                  # <- Inyección explícita
      DB_PASSWORD: ${DB_PASSWORD}          # <- Inyección explícita
      DB_APP_USER: ${DB_APP_USER}          # <- Cuenta de bajo privilegio de la API
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}  # <- Cuenta de bajo privilegio de la API
      JWT_SECRET: ${JWT_SECRET}            # <- Inyección explícita
      REDIS_HOST: securehub-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FILE_SERVER_URL: http://securehub-files
    depends_on:
      securehub-db:
        condition: service_healthy
      securehub-redis:
        condition: service_healthy
    volumes:
      - logs-data:/app/logs
      - ./backend/src:/app/src
    networks:
      - securehub_lan
    ports:
      - "3000:3000"
    restart: unless-stopped

  securehub-frontend:
    build: ./frontend
    container_name: securehub_frontend
    depends_on:
      - securehub-api
    networks:
      - securehub_lan
    ports:
      - "80:8080"
    restart: unless-stopped

networks:
  securehub_lan:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  files-data:
  logs-data:
  backups-data: