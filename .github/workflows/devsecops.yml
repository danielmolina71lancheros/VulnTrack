name: VulnTrack DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analisis estatico SAST
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Analizar codigo
        run: semgrep scan --config auto --error backend frontend

  backend:
    name: Validacion del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test -- --ci

      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Validacion del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  trivy:
    name: Escaneo de vulnerabilidades con Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Escanear dependencias y configuraciones
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true

  docker-build:
    name: Validar construccion de imagenes Docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            ruta: ./backend
          - nombre: frontend
            ruta: ./frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Construir imagen
        run: docker build --pull -t vulntrack-${{ matrix.nombre }}:ci ${{ matrix.ruta }}

  dast:
    name: Analisis dinamico DAST con OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Iniciar PostgreSQL de pruebas
        shell: bash
        run: |
          docker run -d \
            --name vulntrack-dast-db \
            -e POSTGRES_DB=securehub \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci_postgres_password \
            -p 5432:5432 \
            -v "$GITHUB_WORKSPACE/base_datos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro" \
            -v "$GITHUB_WORKSPACE/base_datos/02-migration-v2.sql:/docker-entrypoint-initdb.d/02-migration-v2.sql:ro" \
            -v "$GITHUB_WORKSPACE/base_datos/03-migration-v3.sql:/docker-entrypoint-initdb.d/03-migration-v3.sql:ro" \
            postgres:18.6-alpine

          ready=false

          for i in {1..60}; do
            if docker exec vulntrack-dast-db \
              psql -v ON_ERROR_STOP=1 -U postgres -d securehub \
              -tAc "SELECT CASE WHEN to_regclass('public.plan_vulnerabilidades') IS NOT NULL AND to_regclass('public.historial_vulnerabilidad') IS NOT NULL AND to_regclass('public.notificaciones') IS NOT NULL THEN 1 ELSE 0 END;" \
              2>/dev/null | grep -q '^1$'; then
              ready=true
              echo "PostgreSQL y las migraciones están listos."
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            docker logs vulntrack-dast-db
            echo "::error::PostgreSQL no terminó la inicialización o faltan tablas."
            exit 1
          fi

          docker exec vulntrack-dast-db \
            psql -v ON_ERROR_STOP=1 -U postgres -d securehub \
            -c "SELECT to_regclass('public.plan_vulnerabilidades'), to_regclass('public.historial_vulnerabilidad'), to_regclass('public.notificaciones');"

      - name: Configurar cuenta de base de datos para CI
        shell: bash
        run: |
          docker exec vulntrack-dast-db \
            psql -v ON_ERROR_STOP=1 -U postgres -d securehub \
            -c "ALTER USER app_user WITH PASSWORD 'ci_app_password';"

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        working-directory: backend
        run: npm test -- --ci

      - name: Iniciar API VulnTrack
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: securehub
          DB_APP_USER: app_user
          DB_APP_PASSWORD: ci_app_password
          JWT_SECRET: ci_only_secret_for_security_testing
          CORS_ORIGINS: http://localhost:5173
          DISABLE_BACKGROUND_WORKERS: "true"
        shell: bash
        run: |
          npm start > /tmp/vulntrack-api.log 2>&1 &
          echo $! > /tmp/vulntrack-api.pid

          for i in {1..30}; do
            if curl --silent --fail \
              http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done

          cat /tmp/vulntrack-api.log
          exit 1

      - name: Validar especificacion OpenAPI
        shell: bash
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api-docs.json \
            -o /tmp/openapi.json

          node <<'NODE'
          const fs = require('fs');
          const spec = JSON.parse(fs.readFileSync('/tmp/openapi.json', 'utf8'));

          if (!spec.openapi || !spec.paths || Object.keys(spec.paths).length === 0) {
            console.error('La especificacion OpenAPI no es valida o no contiene rutas.');
            process.exit(1);
          }

          console.log('OpenAPI valida:', Object.keys(spec.paths).length, 'rutas');
          NODE

      - name: Analizar API con OWASP ZAP
        shell: bash
        run: |
          set +e
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://127.0.0.1:3000/api-docs.json \
              -f openapi \
            -S \
            -r zap-dast-report.html \
            -J zap-dast-report.json
          zap_exit=$?
          set -e

          if [ ! -s zap-dast-report.json ]; then
            echo "::error::OWASP ZAP no genero el informe JSON."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('zap-dast-report.json', 'utf8'));
          const sites = report.site || [];
          const alerts = sites.flatMap(site => site.alerts || []);

          const severe = alerts.filter(alert => {
            const risk = Number(alert.riskcode);
            return Number.isFinite(risk) && risk >= 3;
          });

          console.log(`Alertas revisadas: ${alerts.length}`);
          console.log(`Alertas altas o críticas: ${severe.length}`);

          for (const alert of severe) {
            console.error(
              `ALERTA: ${alert.riskdesc || alert.name || 'Riesgo alto o crítico'}`
            );
          }

          if (severe.length > 0) {
            console.error('DAST bloqueado: se encontraron riesgos altos o críticos.');
            process.exit(1);
          }
          NODE

          if [ "$zap_exit" -ne 0 ] && [ "$zap_exit" -ne 2 ]; then
            echo "::error::OWASP ZAP fallo por un error de ejecucion."
            exit "$zap_exit"
          fi

          echo "DAST finalizado sin alertas altas o críticas."

      - name: Publicar informe DAST
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulntrack-zap-dast-report
          path: |
            zap-dast-report.html
            zap-dast-report.json
          if-no-files-found: warn

      - name: Limpiar entorno de pruebas
        if: always()
        run: docker rm -f vulntrack-dast-db
