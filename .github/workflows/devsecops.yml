
name: VulnTrack DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analisis estatico SAST
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Analizar codigo
        run: semgrep scan --config auto --error backend frontend

  backend:
    name: Validacion del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Validacion del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  trivy:
    name: Escaneo de vulnerabilidades con Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Escanear dependencias y configuraciones
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

  docker-build:
    name: Validar construccion de imagenes Docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            ruta: ./backend
          - nombre: frontend
            ruta: ./frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Construir imagen
        run: docker build --pull -t vulntrack-${{ matrix.nombre }}:ci ${{ matrix.ruta }}

