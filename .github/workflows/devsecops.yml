
name: VulnTrack DevSecOps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validar configuracion de hooks pre-commit
        run: python -m pip install pre-commit && pre-commit validate-config

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analisis estatico SAST
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Analizar codigo
        run: semgrep scan --config auto --error --exclude 'backend/zap-reports/**' backend frontend

  backend:
    name: Validacion del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test -- --ci

      - name: Analizar backend y frontend con reglas ESLint Security
        working-directory: .
        run: backend/node_modules/.bin/eslint backend/src frontend/src --config eslint.config.cjs

      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Validacion del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  trivy:
    name: Escaneo de vulnerabilidades con Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Escanear dependencias y configuraciones
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivy-args: --skip-dirs backend/node_modules --skip-dirs frontend/node_modules --skip-dirs frontend/dist --skip-dirs backend/zap-reports --skip-dirs .agents --skip-dirs .kiro --skip-dirs .qodo

  docker-build:
    name: Validar construccion de imagenes Docker
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, backend, frontend, trivy, dast]
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            ruta: ./backend
          - nombre: frontend
            ruta: ./frontend
          - nombre: scanner
            ruta: ./scanner
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Construir imagen
        run: docker build --pull -t vulntrack-${{ matrix.nombre }}:ci ${{ matrix.ruta }}

      - name: Escanear imagen construida
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vulntrack-${{ matrix.nombre }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Iniciar sesión en Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publicar imagen versionada y latest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="$DOCKERHUB_USERNAME/vulntrack-${{ matrix.nombre }}"
          docker tag "vulntrack-${{ matrix.nombre }}:ci" "$image:$version"
          docker tag "vulntrack-${{ matrix.nombre }}:ci" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"

  dast:
    name: Despliegue de staging y DAST con OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Ansible Core
        run: python -m pip install ansible-core

      - name: Validar sintaxis del despliegue
        run: ansible-playbook --syntax-check -i localhost, deploy/ansible/deploy.yml

      - name: Desplegar entorno aislado de staging con Ansible
        env:
          COMPOSE_PROJECT_NAME: vulntrack-staging-${{ github.run_id }}
        run: >-
          ansible-playbook -i localhost, deploy/ansible/deploy.yml
          -e compose_file_override=${{ github.workspace }}/docker-compose.staging.yml
          -e compose_project_name=vulntrack-staging-${{ github.run_id }}
          -e deployment_health_url=http://127.0.0.1:13000/health

      - name: Validar API y OpenAPI en staging
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:13000/health
          curl --fail --silent --show-error http://127.0.0.1:13000/api-docs.json -o /tmp/openapi.json
          node <<'NODE'
          const fs = require('fs');
          const spec = JSON.parse(fs.readFileSync('/tmp/openapi.json', 'utf8'));
          if (!spec.openapi || !spec.paths || Object.keys(spec.paths).length === 0) {
            throw new Error('OpenAPI invalida o sin rutas');
          }
          console.log(`OpenAPI valida: ${Object.keys(spec.paths).length} rutas`);
          NODE

      - name: Preparar directorio para informes
        run: mkdir -p "$GITHUB_WORKSPACE/zap-output" && chmod 777 "$GITHUB_WORKSPACE/zap-output"

      - name: Analizar API de staging con OWASP ZAP
        shell: bash
        run: |
          set +e
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://127.0.0.1:13000/api-docs.json \
            -f openapi \
            -S \
            -r /zap/wrk/zap-dast-report.html \
            -J /zap/wrk/zap-dast-report.json
          zap_exit=$?
          set -e

          if [ ! -s "$GITHUB_WORKSPACE/zap-output/zap-dast-report.json" ]; then
            echo "::error::OWASP ZAP no genero el informe JSON."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('zap-output/zap-dast-report.json', 'utf8'));
          const alerts = (report.site || []).flatMap(site => site.alerts || []);
          const severe = alerts.filter(alert => Number(alert.riskcode) >= 3);
          console.log(`Alertas revisadas: ${alerts.length}`);
          console.log(`Alertas altas o criticas: ${severe.length}`);
          for (const alert of severe) {
            console.error(`ALERTA: ${alert.riskdesc || alert.name || 'Riesgo alto o critico'}`);
          }
          if (severe.length > 0) process.exit(1);
          NODE

          validation_exit=$?
          if [ "$validation_exit" -ne 0 ]; then exit "$validation_exit"; fi
          if [ "$zap_exit" -ne 0 ] && [ "$zap_exit" -ne 2 ]; then
            echo "::error::OWASP ZAP fallo por un error de ejecucion."
            exit "$zap_exit"
          fi
          echo "DAST de staging finalizado sin alertas altas o criticas."

      - name: Publicar informe DAST
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulntrack-zap-dast-report
          path: |
            zap-output/zap-dast-report.html
            zap-output/zap-dast-report.json
          if-no-files-found: warn

      - name: Limpiar entorno temporal de staging
        if: always()
        env:
          COMPOSE_PROJECT_NAME: vulntrack-staging-${{ github.run_id }}
        run: docker compose -f docker-compose.staging.yml down --volumes --remove-orphans
