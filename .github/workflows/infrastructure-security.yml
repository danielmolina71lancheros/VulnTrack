name: VulnTrack Infrastructure Security

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.staging.yml"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "scanner/Dockerfile"
      - "deploy/**"
      - ".github/workflows/infrastructure-security.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-validation:
    name: Validar automatización Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar Ansible Core
        run: python -m pip install ansible-core
      - name: Validar sintaxis de los playbooks
        run: |
          ansible-playbook --syntax-check -i localhost, deploy/ansible/deploy.yml
          ansible-playbook --syntax-check -i localhost, deploy/ansible/validate-deploy.yml

  threat-model:
    name: Validar modelo STRIDE y DFD
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validar modelo Threat Dragon
        run: |
          node <<'NODE'
          const fs = require('fs');
          const model = JSON.parse(fs.readFileSync('security/threat-model.json', 'utf8'));
          const diagrams = model.detail?.diagrams || [];
          if (diagrams.length !== 2 || !diagrams.every(d => d.diagramType === 'STRIDE' && d.diagramJson?.cells?.length)) {
            throw new Error('El modelo debe incluir DFD de nivel 0 y nivel 1 en formato STRIDE.');
          }
          for (const diagram of diagrams) {
            const cells = diagram.diagramJson.cells;
            const ids = new Set(cells.map(cell => cell.id));
            for (const cell of cells) {
              if (cell.type === 'tm.Flow' && (!ids.has(cell.source?.id) || !ids.has(cell.target?.id))) {
                throw new Error(`Flujo con origen/destino inválido en ${diagram.title}`);
              }
            }
          }
          const threatTypes = new Set(diagrams.flatMap(d => d.diagramJson.cells.flatMap(c => (c.threats || []).map(t => t.type))));
          for (const category of ['Spoofing', 'Tampering', 'Repudiation', 'Information disclosure', 'Denial of service', 'Elevation of privilege']) {
            if (![...threatTypes].some(type => type.toLowerCase() === category.toLowerCase())) {
              throw new Error(`Falta una amenaza STRIDE: ${category}`);
            }
          }
          console.log(`Threat Dragon válido: ${diagrams.length} DFD y ${threatTypes.size} categorías STRIDE.`);
          NODE

  checkov:
    name: Escaneo IaC con Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Analizar Terraform, Docker Compose y Dockerfiles
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: .
          config_file: deploy/.checkov.yaml
          framework: terraform,dockerfile,yaml,ansible
          external_checks_dirs: deploy/checkov/custom_checks
          soft_fail: false
          output_format: cli
